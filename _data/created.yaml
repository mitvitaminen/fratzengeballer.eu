    ufw:
        topic: Firewalls 
        why: linux uncomplicated firewall you would configure to deny incoming traffic becasue normally you do not run a server. When you run SSH Remotelogin on your device alter the rules by the below command. Do all know thatz  HTTP-GET-Request is send by you most of the times, like browsing in a browser does that whenb you enter a URL the webpage-hosting-computer send then a REPLY with RESPONSECODE too like 404 error or it has attached the web-page. All this is actually OUTGOING even when you download, since u first click an item an REQUEST it then.
        cmd: Commands for ufw firewall
        pre: <pre>sudo ufw default deny incomming</pre> <br> <pre>sudo ufw allow incoming ssh</pre>
