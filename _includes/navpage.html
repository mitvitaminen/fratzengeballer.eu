<nav class="sticky">
    <div class=" float_r top0 margin1rem">
        <ul>
            {% for page in site.pages %}
                {% if page.inmenu == true %}
                    <li><a href="{{ page.url }}">{{page.title}}</a></li>
                {% endif %}
            {% endfor %}        
            <li><a href="#imprint">Imprint</a></li>
        </ul>
    </div>
    <div class="float_l top0 margin1rem">
        <ul>
        {% for anchor in site.data.anchors.indexpage %}
            <li><a href='#{{ anchor.anchor }}'>{{ anchor.txt }}</a></li>
        {% endfor %}
        </ul>
    </div>
</nav>
