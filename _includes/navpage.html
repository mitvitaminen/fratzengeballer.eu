<nav id="pagenavi">
    <ul>
        <li><i class="fa-solid fa-bars"></i></li>
        <div class="pagenavs">
        {% for page in site.pages %}

            {% endif %}
        {% endfor %}
        </div>
    </ul>
</nav>
