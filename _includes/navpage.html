<nav id="pagenav">
    <div class="sticky float_r pTop0">
        <i class="fa-solid fa-bars"></i>        
        <ul >
        {% for page in site.pages %}
            {% if page.inmenu == true %}
                <li><a href="{{ page.url }}">{{page.title}}</a></li>
            {% endif %}
        {% endfor %}        
        </ul>
    </div>
</nav>
